[versions]
# Kotlin & JVM
kotlin = "2.4.20"
loom = "1.18.2"
shadow = "9.6.1"

# Minecraft & Fabric
minecraft = "26.3"
yarn = "26.3+build.1:v2"
fabric-loader = "0.19.5"
fabric-api = "0.161.0+26.3"
fabric-kotlin = "1.14.1+kotlin.2.4.20"

# Bedrock & Geyser
floodgate = "2.2.5-SNAPSHOT"
geyser = "2.5.0-SNAPSHOT"
cumulus = "1.1.2"

[libraries]
# Minecraft & Fabric Libraries
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn-mappings = { module = "net.fabricmc:yarn", version.ref = "yarn" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }

# Bedrock & Geyser Libraries
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
geyser-api = { module = "org.geysermc.geyser:api", version.ref = "geyser" }
cumulus = { module = "org.geysermc.cumulus:cumulus", version.ref = "cumulus" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
